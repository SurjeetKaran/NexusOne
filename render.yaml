services:
  # ── Backend (Web Service) ──────────────────────────────────────────────────
  - type: web
    name: nexusone-backend
    runtime: node
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: MONGO_URI
        sync: false          # set manually in Render dashboard
      - key: JWT_SECRET
        sync: false          # set manually in Render dashboard
      - key: FRONTEND_URL
        sync: false          # set to your Render frontend URL after deploy
    healthCheckPath: /

  # ── Frontend (Static Site) ────────────────────────────────────────────────
  - type: web
    name: nexusone-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        sync: false          # set to your Render backend URL after deploy
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
